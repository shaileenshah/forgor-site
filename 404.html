<style>
  :root{
    --ground:#121212; --ink:#EFE9DD; --muted:#8E8779;
    --hairline:rgba(255,255,255,.11); --gold:#C6A664;
    --display:"Playfair Display",Georgia,"Times New Roman",serif;
    --text:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}

  h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,6vw,48px);line-height:1.1;margin:56px 0 0}
  h2{font-family:var(--display);font-weight:400;font-size:clamp(22px,3.4vw,27px);line-height:1.2;margin:46px 0 0}
  p{margin:14px 0 0;color:var(--muted)}
  p.lede{color:var(--ink)}
  hr{border:0;border-top:1px solid var(--hairline);margin:54px 0 0}
  footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:26px}
